name: Crear Ejecutable Windows

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar librerias
        run: pip install pyinstaller customtkinter pillow
      - name: Convertir PNG a ICO y Crear EXE con Logo
        run: |
          python -c "from PIL import Image; img = Image.open('logo.png'); img.save('logo.ico', format='ICO', sizes=[(256, 256), (64, 64), (32, 32), (16, 16)])"
          pyinstaller --noconfirm --onefile --windowed --icon=logo.ico --add-data "logo.ico;." --collect-all customtkinter --name AdvanHelper_v4 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AdvanHelper-Portable-v4
          path: dist/AdvanHelper_v4.exe
      - name: Publicar en Releases (Descarga sin cuenta)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4-latest
          name: "Advan Helper Pro v4 (Última Versión)"
          body: "Descarga directa del ejecutable portable `AdvanHelper_v4.exe` sin necesidad de iniciar sesión."
          files: dist/AdvanHelper_v4.exe
          prerelease: false
          make_latest: true
