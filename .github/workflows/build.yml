name: Crear Ejecutable Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Empaquetar en .EXE con PyInstaller y CustomTkinter
      run: |
        pip install pyinstaller customtkinter
        pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --name "AdvanHelper_v2" main.py
        
    - name: Subir el archivo .EXE listo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: AdvanHelper-Portable-v2
        path: dist/AdvanHelper_v2.exe
